{% extends 'base.html' %}
{% block title %}{{ form.instance.pk|yesno:"Update Student,Add Student" }}{% endblock %}
{% block content %}
<style>
    .form-page-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
    }

    .form-container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        padding: 50px;
        max-width: 600px;
        width: 100%;
        position: relative;
        overflow: hidden;
    }

    .form-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .form-title {
        font-size: 2.2em;
        font-weight: 700;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 0 0 40px 0;
        text-align: center;
    }

    .form-title::before {
        content: '{{ form.instance.pk|yesno:"✏️,➕" }}';
        display: block;
        font-size: 2em;
        margin-bottom: 15px;
        filter: grayscale(0);
        -webkit-text-fill-color: initial;
    }

    form p {
        margin-bottom: 25px;
    }

    form label {
        display: block;
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
        font-size: 1em;
    }

    form input[type="text"],
    form input[type="email"],
    form input[type="tel"],
    form input[type="number"],
    form textarea,
    form select {
        width: 100%;
        padding: 14px 18px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1em;
        transition: all 0.3s ease;
        box-sizing: border-box;
        font-family: inherit;
    }

    form input:focus,
    form textarea:focus,
    form select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    form textarea {
        resize: vertical;
        min-height: 100px;
    }

    .errorlist {
        list-style: none;
        padding: 0;
        margin: 8px 0 0 0;
    }

    .errorlist li {
        color: #f5576c;
        font-size: 0.9em;
        padding: 6px 12px;
        background: #fff5f7;
        border-radius: 6px;
        margin-top: 5px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .errorlist li::before {
        content: '⚠️';
        font-size: 1.1em;
    }

    form input.error,
    form textarea.error,
    form select.error {
        border-color: #f5576c;
    }

    .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 35px;
        flex-wrap: wrap;
    }

    .save-btn {
        flex: 1;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 16px 35px;
        font-size: 1.1em;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .save-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .save-btn:active {
        transform: translateY(0);
    }

    .save-btn::after {
        content: '💾';
        font-size: 1.2em;
    }

    .back-link {
        flex: 1;
        text-align: center;
        padding: 16px 35px;
        background: white;
        color: #667eea;
        border: 2px solid #667eea;
        text-decoration: none;
        font-weight: 600;
        font-size: 1.1em;
        border-radius: 10px;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-sizing: border-box;
    }

    .back-link:hover {
        background: #667eea;
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .back-link::before {
        content: '←';
        font-size: 1.3em;
    }

    .help-text {
        font-size: 0.85em;
        color: #666;
        margin-top: 5px;
        font-style: italic;
    }

    @media (max-width: 768px) {
        .form-container {
            padding: 35px 25px;
        }

        .form-title {
            font-size: 1.8em;
        }

        .form-actions {
            flex-direction: column;
        }

        .save-btn,
        .back-link {
            width: 100%;
        }
    }
</style>

<div class="form-page-container">
    <div class="form-container">
        <h2 class="form-title">{{ form.instance.pk|yesno:"Update Student,Add Student" }}</h2>
        
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div class="form-actions">
                <button type="submit" class="save-btn">Save</button>
                <a href="{% url 'student_list' %}" class="back-link">Back to List</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
